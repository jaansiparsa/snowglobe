<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snowcase</title>
<meta name="description" content="Snowcase: put any image inside a glass snow globe and shake it. Real-time refraction, GPU snow, and curl-noise water in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<aside id="panel">
  <header>
    <h1>Snowcase</h1>
    <button id="panelToggle" class="ghost" aria-label="Toggle controls">☰</button>
  </header>
  <div class="body">
    <section>
      <h2>Subject</h2>
      <div class="row">
        <button data-preset="pine">Pine</button>
        <button data-preset="cottage">Cottage</button>
        <label class="btn">Your image…<input id="file" type="file" accept="image/*" hidden></label>
      </div>
      <p class="note">Or drop an image anywhere. Transparent PNGs become cut-outs.</p>
    </section>
    <section>
      <h2>Snow</h2>
      <label>Flakes
        <select id="count">
          <option value="64">4,096</option>
          <option value="128">16,384</option>
          <option value="256">65,536</option>
          <option value="512">262,144</option>
        </select>
      </label>
      <label>Turbulence <input id="turb" type="range" min="0" max="2" step="0.05" value="1"></label>
      <div class="row">
        <button id="shake" class="primary">Shake</button>
        <button id="motion" hidden>Use phone motion</button>
      </div>
    </section>
    <section>
      <h2>Glass</h2>
      <label>Glass IOR <span id="iorGv">1.50</span><input id="iorG" type="range" min="1" max="1.9" step="0.01" value="1.5"></label>
      <label>Water IOR <span id="iorWv">1.33</span><input id="iorW" type="range" min="1" max="1.6" step="0.01" value="1.33"></label>
      <label>View
        <select id="mode">
          <option value="0">Full optics</option>
          <option value="1">No refraction</option>
          <option value="2">Interior buffer</option>
        </select>
      </label>
    </section>
    <section>
      <h2>Performance</h2>
      <p id="fps" class="note">…</p>
      <button id="bench">Run benchmark</button>
      <div id="benchOut"></div>
    </section>
  </div>
</aside>

<p id="hint">Drag the globe to shake · right-drag to orbit · scroll to zoom · space to shake</p>
<a id="back" href="../milestone.html">Milestone report ↗</a>

<script type="module" src="src/main.js"></script>
</body>
</html>
